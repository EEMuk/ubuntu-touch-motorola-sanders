# mke2fs defaults for images the sanders 3.18 kernel must mount.
# e2fsprogs >= 1.43 enables metadata_csum, metadata_csum_seed (incompat 0x2000)
# and orphan_file by default; 3.18 refuses the first two, so stick to the
# feature set e2fsprogs 1.42 used.
[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384

[fs_types]
	ext4 = {
		features = has_journal,extent,huge_file,flex_bg,64bit,dir_nlink,extra_isize
	}
