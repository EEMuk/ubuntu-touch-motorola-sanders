# ofono-binder-plugin: the PE11 vendor registers
# android.hardware.radio@1.1::IRadio on slot1 and slot2 (dual SIM).
[Settings]
ExpectSlots = slot1,slot2
radioInterface = 1.1
# radio@1.1 QTI modems don't PS-attach until told which slot may use data
allowDataReq = on
# Pushing data profiles (incl. the empty MMS APN) makes qcril reject them
# ('ril_apn provided is NULL') and the data registration flap
useDataProfiles = off

[slot1]
path = /ril_0
slot = 0

[slot2]
path = /ril_1
slot = 1
