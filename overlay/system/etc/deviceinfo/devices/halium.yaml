# Device config for Moto G5S Plus (sanders), read by libdeviceinfo.
# ro.product.device is the GSI name (halium_arm64); the real codename is in
# ro.product.vendor.device, so both are listed under Names.
SANDERS:
  Names:
    - sanders
    - SANDERS
    - halium_arm64
    - Moto G (5S) Plus

  PrettyName: Moto G5S Plus
  DeviceType: phone
  # 1080x1920 5.5" panel, ~401 ppi
  GridUnit: 20
  SupportedOrientations:
    - Portrait
    - Landscape
    - InvertedLandscape

  OfonoPlugin: binder
  OfonoImplementsIms: true

  # Dual-tone rear flash: led:torch_0 is the white LED, led:torch_1 the
  # amber one (torch-light0 drives the amber). Flashlight = white only.
  FlashlightSysfsPath: /sys/class/leds/led:torch_0/brightness
  FlashlightSwitchPath: /sys/class/leds/led:switch/brightness

  # Trimmed audio policy (no HDMI Out), generated at boot by
  # sanders-vendor-overrides; the stock one crashes pulseaudio-modules-droid.
  PulseaudioModulesDroid_ExtraCardArgs: config=/run/sanders-vendor/audio/audio_policy_configuration.xml
