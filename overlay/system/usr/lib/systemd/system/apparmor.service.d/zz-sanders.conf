[Service]
# wipe-aa-cache-on-channel-switch.py exits 1 ("not system-image based") when
# channel.ini has no build_number, which aborts the unit before any profile
# is loaded. Its failure must not block AppArmor.
ExecStartPre=
ExecStartPre=-/usr/libexec/lxc-android-config/wipe-aa-cache-on-channel-switch.py
