[Service]
# module-droid-discover picks module-droid-card-30 (SDK 30), which routes
# only through audio patches. The msm8953 audio HAL doesn't implement
# create_audio_patch (ENOSYS), so nothing was routed and VoLTE calls had
# no audio. module-droid-card-29 routes with set_parameters("routing=").
ExecStartPre=/bin/sh -c 'sed "s|^load-module module-droid-discover.*|load-module module-droid-card-29 voice_virtual_stream=true config=/run/sanders-vendor/audio/audio_policy_configuration.xml quirks=-output_deep_buffer\\nload-module module-droid-hidl helper=false|" /etc/pulse/touch.pa > %t/sanders-touch.pa'
Environment=PULSE_SCRIPT=%t/sanders-touch.pa
